# First the fast checks (scripts/ci-check.sh): the code style, the layers and the unit
# tests on the host (SOURCE/test/unit). Then it builds GMENUPRG.EXE and GMEDIT.EXE with
# Open Watcom and runs the screen tests:
# SOURCE/test/run.py runs the programs in DOSBox for every case of SOURCE/test/cases.txt
# and compares the screen with the expected one. Debian's dosbox package is DOSBox 0.74,
# which run.py drives headless (SDL dummy video and audio); the same tests also pass with
# DOSBox Staging. scripts/ci-toolchain.sh installs the pinned Open Watcom and clang-format.
#
# A tag (vX.Y.Z) also publishes a Gitea release: GMENU-<tag>.zip with the GMENU folder
# to install, and GMENUPRG.EXE and GMEDIT.EXE alone, for updating an installed menu.
#
# A tag also puts the menu into the DOSINST program store
# (ftp://ftp.teletypegames.org/APPS): the store step builds the GMENU folder(s) with an INFO.INI
# and a FILES.LST (scripts/ci-store.sh into a temporary folder) and sends them as a tar
# over SSH to the server's deploy user. Its key (secret deploy_ssh_key, tag events only)
# is bound on the server to one fixed command (ci-deploy, infra/host-config), which unpacks
# the upload unprivileged, accepts only the GMENU folder(s) with regular files, and
# swaps them into /srv/stacks/ftp-server/root/APPS. No trusted volumes are needed.
when:
  - event: [push, manual]
    branch: master
  - event: pull_request
  - event: tag

steps:
  - name: test
    # Debian bookworm with the toolchain of scripts/ci-toolchain.sh preinstalled
    # (services/teletypegames ci/dos-bookworm.Dockerfile); a moving tag, so always pulled.
    image: git.teletypegames.org/build/dos-ci:bookworm
    pull: true
    commands:
      - scripts/ci-toolchain.sh
      - scripts/ci-check.sh
      - scripts/ci-build.sh
      - scripts/ci-test.sh

  # Only on a tag, and only after the tests passed: the release gets the program the
  # test step built and tested.
  - name: release
    # curl, jq, zip and git are in the image (services/teletypegames ci/ci-tools.Dockerfile); by digest,
    # since the step gets a token
    image: git.teletypegames.org/build/ci-tools@sha256:4f03160226e51bdf67b850f21a9fbeab7314127766979f72e514efb5ef4dcba8
    environment:
      # A build started by the tag webhook may not get Woodpecker's forge credential, so
      # the token is a repository secret; the script falls back to the forge credential
      # when it is there.
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - scripts/ci-package.sh
      - scripts/ci-upload.sh
    when:
      - event: tag

  # Only on a tag, after the release: DOSINST installs and updates GMENU from the store.
  - name: store
    image: git.teletypegames.org/build/deploy-ssh@sha256:e1753f7dd575caf5e835ff19cc152faa56478cad76c142ca0f47ad3a3f4a2605
    environment:
      DEPLOY_SSH_KEY:
        from_secret: deploy_ssh_key
    commands:
      - rm -rf /tmp/store && mkdir /tmp/store
      - STORE=/tmp/store scripts/ci-store.sh
      - mkdir -p -m 700 "$HOME/.ssh"
      - printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_deploy" && chmod 600 "$HOME/.ssh/id_deploy"
      - echo 'vps.teletype.hu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPR9RYc98lPw4w6LYlaVAkZTlleO+kE4vyWxEk9x3EDd' > "$HOME/.ssh/known_hosts"
      - tar -C /tmp/store -cf - . | ssh -i "$HOME/.ssh/id_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@vps.teletype.hu
    when:
      - event: tag
