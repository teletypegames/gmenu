# Builds GMENUPRG.COM and runs the screen tests: SOURCE/test/run.py runs the program
# in DOSBox for every case of SOURCE/test/cases.txt and compares the screen with the
# expected one. Debian's dosbox package is DOSBox 0.74, which run.py drives headless
# (SDL dummy video and audio); the same tests also pass with DOSBox Staging.
#
# A tag (vX.Y.Z) also publishes a Gitea release: GMENU-<tag>.zip with the GMENU folder
# to install, and GMENUPRG.COM alone, for updating an installed menu. The scripts work
# on every tagged version, also on the ones from before the tests and SOURCE/ existed.
when:
  - event: [push, manual]
    branch: master
  - event: pull_request
  - event: tag

steps:
  - name: test
    image: debian:bookworm-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends nasm dosbox python3
      - scripts/ci-build.sh
      - scripts/ci-test.sh

  # Only on a tag, and only after the tests passed: the release gets the program the
  # test step built and tested.
  - name: release
    image: alpine
    environment:
      # A build started by the tag webhook may not get Woodpecker's forge credential, so
      # the token is a repository secret; the script falls back to the forge credential
      # when it is there.
      GITEA_TOKEN:
        from_secret: gitea_token
    commands:
      - apk add --no-cache curl jq zip
      - scripts/ci-package.sh
      - scripts/ci-upload.sh
    when:
      - event: tag
